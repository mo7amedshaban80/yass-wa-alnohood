<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        img {
            max-width: 90%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>صور المشروع</h1>
    <div class="gallery">
        <img src="image_0.png.jpg" alt="الصورة الأولى">
        <img src="image_1.png.jpg" alt="الصورة الثانية">
        <img src="image_2.png.jpg" alt="الصورة الثالثة">
        <img src="image_3.png.jpg" alt="الصورة الرابعة">
    </div>

</body>
</html>
